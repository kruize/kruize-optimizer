name: Build Check

on:
  # Triggers on direct pushes to key branches
  push:
    branches: [ main, mvp_demo ]
  # Triggers on Pull Requests opened against ANY branch
  pull_request:
    branches: [ '**' ]

# Automatically cancel in-progress runs on the same PR/branch when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Test Quarkus Container Build
        run: |
          ./mvnw clean package \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=false \
            -Dquarkus.container-image.image="quay.io/kruize/optimizer:test" \
            -Dquarkus.jib.platforms="linux/amd64"
