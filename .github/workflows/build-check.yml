name: Build Check

on:
  push:
    branches: [ main, mvp_demo ]
  pull_request:
    branches: [ '**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Sets image tag to PR number (pr-12) or sanitized Branch name (e.g. main)
      - name: Set Image Tag
        id: image_tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TAG=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          else
            # Replaces slashes with dashes to prevent invalid Docker tags (e.g. feature/demo -> feature-demo)
            CLEAN_REF=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            echo "TAG=${CLEAN_REF}" >> $GITHUB_OUTPUT
          fi

      - name: Test Quarkus Container Build
        run: |
          ./mvnw clean package \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=false \
            -Dquarkus.container-image.image="quay.io/kruizehub/optimizer:${{ steps.image_tag.outputs.TAG }}" \
            -Dquarkus.jib.platforms="linux/amd64"
