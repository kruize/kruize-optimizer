[pytest]
markers =
    e2e: End-to-end tests requiring a running cluster
    smoke: Quick smoke tests (pod running checks)
    api: API endpoint tests (profiles, datasources, experiments)
    kind: Tests specific to kind clusters
    openshift: Tests specific to openshift clusters
    manifest_mode: Tests for manifest install mode
    operator_mode: Tests for operator install mode

# Disable ALL console logging - we use print() for clean UX
# -s allows print() to show on console immediately
addopts = -v --tb=short -s
log_cli = false
log_cli_level = CRITICAL

testpaths = tests
