# Kind cluster configuration for E2E tests
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Expose Kruize service
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # Expose Optimizer service
      - containerPort: 30081
        hostPort: 8081
        protocol: TCP
      # Expose Prometheus
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP


