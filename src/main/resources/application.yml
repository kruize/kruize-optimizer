quarkus:
  application:
    name: kruize-optimizer-service
    version: 1.0.0
  smallrye-openapi:
    path: /openapi
  swagger-ui:
    path: /swagger-ui
    always-include: ${ENABLE_SWAGGER:false}

  # Enable configuration for a production-ready logging environment
  log:
    console:
      json:
        enabled: false
        pretty-print: false

  # --- Rest Client Config ---
  rest-client:
    kruize-api:
      # URL of the Kruize Autotune service
      # In k8s: http://<service-name>.<namespace>:<port>
      url: ${KRUIZE_URL:http://kruize:8080}

# --- Kruize Optimizer Configuration ---
kruize:
  scan:
    # Frequency to scan K8s for new workloads (cron format or duration)
    interval: ${KRUIZE_SCAN_INTERVAL:15m}
  profile:
    git:
      # Reference for profile index
      reference-url: ${KRUIZE_PROFILE_GIT_URL:local}
      # Base URL for fetching raw manifests
      base-url: ${KRUIZE_PROFILE_GIT_BASE_URL:local}
  target:
    labels:
      # Max number of labels to process
      limit: ${KRUIZE_TARGET_LABEL_LIMIT:10}
      # Pass labels as a JSON String (Object or Array of "key=value")
      json: '${KRUIZE_TARGET_LABELS:["kruize/autotune=enabled"]}'
